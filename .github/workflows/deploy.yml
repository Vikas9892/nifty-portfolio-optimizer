name: CD — Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".env.*"
  workflow_dispatch:         # Allow manual trigger

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false  # Never cancel an in-flight deploy

jobs:
  # ── Docker image build + push (to GHCR) ────────────────────────────────────
  docker-build:
    name: Build & Push Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Docker meta (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          # Must match render.yaml's dockerContext — the Dockerfile does
          # `COPY . /app/backend/`, so a repo-root context nests the package one
          # level too deep and every `from backend.…` import fails at runtime.
          context: ./backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: VITE_API_URL=${{ vars.VITE_API_URL || '' }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── Deploy backend to Render ────────────────────────────────────────────────
  # Render also auto-deploys on push (autoDeploy: true in render.yaml). This job
  # is only needed if you turn autoDeploy off and want CI to gate the deploy.
  # Set the RENDER_DEPLOY_HOOK secret to the hook URL from
  # Render dashboard → service → Settings → Deploy Hook.
  deploy-backend:
    name: Deploy backend → Render
    runs-on: ubuntu-latest
    needs: docker-build
    environment: production
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK secret not configured — relying on Render autoDeploy"
            exit 0
          fi
          curl --fail --silent --show-error "$RENDER_DEPLOY_HOOK"

  # ── Deploy frontend to Vercel ───────────────────────────────────────────────
  deploy-frontend:
    name: Deploy frontend → Vercel
    runs-on: ubuntu-latest
    needs: docker-build
    environment: production
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel (production)
        working-directory: frontend
        env:
          VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN secret not configured — skipping deploy"
            exit 0
          fi
          vercel --prod --token "$VERCEL_TOKEN"

  # ── Smoke test deployed endpoints ──────────────────────────────────────────
  smoke-test:
    name: Smoke test production
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Smoke test
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL variable not configured — skipping smoke test"
            exit 0
          fi
          # Render free instances build for several minutes and cold-start on the
          # first request, so retry generously (up to ~10 min) before failing.
          sleep 60
          curl --fail --retry 60 --retry-delay 10 --retry-all-errors \
               --max-time 120 "$BACKEND_URL/health"
          curl --fail --retry 12 --retry-delay 10 --retry-all-errors \
               --max-time 120 "$BACKEND_URL/ready"
