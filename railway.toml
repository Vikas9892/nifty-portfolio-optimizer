# Railway deployment — backend API
# Docs: https://docs.railway.app/reference/config-as-code
#
# Required environment variables (set in Railway dashboard → Variables):
#
#   JWT_SECRET_KEY   = <32-byte hex>   python -c "import secrets; print(secrets.token_hex(32))"
#   ENVIRONMENT      = production
#   WORKERS          = 2
#   CORS_ORIGINS     = ["https://your-app.vercel.app"]
#
# Auto-provided by Railway plugins (no manual entry needed):
#   DATABASE_URL     ← Add PostgreSQL plugin
#   REDIS_URL        ← Add Redis plugin
#   PORT             ← Set automatically by Railway

[build]
builder = "dockerfile"
dockerfilePath = "backend/Dockerfile"
buildContext = "."

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
